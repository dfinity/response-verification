packages:
  - examples/certification/certified-counter/src/frontend
  - examples/http-certification/assets/src/frontend
  - examples/http-certification/assets/src/tests
  - examples/http-certification/custom-assets/src/frontend
  - examples/http-certification/custom-assets/src/tests
  - examples/http-certification/json-api/src/tests
  - examples/http-certification/skip-certification/src/tests
  - examples/http-certification/upgrade-to-update-call/src/tests
  - packages/certificate-verification-js
  - packages/ic-certification-testing-wasm
  - packages/ic-response-verification-wasm
  - packages/ic-response-verification-tests/src/frontend
  - packages/ic-response-verification-tests/src/wasm-tests

minimumReleaseAge: 10080 # ignore dependency updates released less than 7 days ago

overrides:
  # `@dfinity/pic` still pins `@icp-sdk/core` to `^5`. A second copy makes its
  # `Principal` and `IDL` types incompatible with the root one, so it is forced
  # onto a single version. pic only uses `Principal` and `AnonymousIdentity`.
  '@icp-sdk/core': ^6.0.0
  # Advisory fixes for transitive build-time dependencies, to be dropped once
  # `vite` and `vite-plugin-solid` depend on patched versions themselves.
  # Each is bounded to the major its dependents declare, so a future lockfile
  # regeneration cannot pull one past the range `vite` or Babel supports.
  baseline-browser-mapping: '>=2.11.0 <3'
  browserslist: '>=4.28.7 <5'
  postcss: '>=8.5.23 <9'
  '@babel/core': '>=7.29.6 <8'

onlyBuiltDependencies:
  - '@dfinity/pic'
  - esbuild
