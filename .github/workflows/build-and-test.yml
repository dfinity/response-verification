name: build_and_test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  SCCACHE_GHA_ENABLED: 'true'
  RUSTC_WRAPPER: 'sccache'

jobs:
  build_and_test_rust:
    name: build_and_test_rust:required
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - name: Build Cargo crates
        run: cargo build --release

      - name: Test Cargo crates
        run: cargo test --all-features

      - name: Build Cargo docs
        run: cargo doc --no-deps

      - name: Lint Rust
        run: cargo clippy --all-targets --all-features

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

  build_and_test_js:
    name: build_and_test_js:required
    runs-on: ubuntu-latest
    container: ghcr.io/dfinity/icp-dev-env-all:v2.2.1
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup PNPM
        uses: dfinity/ci-tools/actions/setup-pnpm@afeee4fbdc0683a88ec5a74ed7f59a2ce0e833ad # main

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

        # Triggers installation of the Rust toolchain
        # Must be done before wasm-pack is installed
      - name: Cargo metadata
        run: cargo metadata --format-version 1

      - name: Setup wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Generate canister declarations
        run: pnpm run generate

      - name: Build NPM packages
        run: pnpm build

      - name: Build canisters
        run: icp build
        env:
          # Read-only token so icp-cli can fetch recipe releases without hitting rate limits.
          ICP_CLI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Test NPM packages
        run: pnpm test

      - name: Wasm test
        run: wasm-pack test --node packages/ic-response-verification --features=js

      - name: Check Typescript formatting
        run: pnpm run format:check
